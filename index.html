<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1D9E75">
<title>운동</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--c:#1D9E75;--cl:#E1F5EE;--cd:#0F6E56;--bg:#fff;--sf:#f5f5f3;--tx:#1a1a1a;--tm:#6b6b6b;--th:#9e9e9e;--bd:rgba(0,0,0,.1);--r:12px}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--sf:#1e1e1e;--tx:#f0f0f0;--tm:#a0a0a0;--th:#666;--bd:rgba(255,255,255,.1);--cl:#0a2e20}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--tx)}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:env(safe-area-inset-top) 16px calc(16px + env(safe-area-inset-bottom))}

.header{padding:20px 0 12px;text-align:center}
.header h1{font-size:15px;color:var(--tm);font-weight:500}
.routine-label{font-size:28px;font-weight:700;margin:4px 0 2px}
.routine-sub{font-size:12px;color:var(--th)}

.weight-row{display:flex;align-items:center;gap:8px;background:var(--sf);border-radius:var(--r);padding:10px 12px;margin:12px 0}
.weight-row .wv{font-size:20px;font-weight:700;flex:1}
.weight-row .wv span{font-size:12px;color:var(--tm);font-weight:400}
.weight-row input{width:64px;border:1px solid var(--bd);border-radius:8px;padding:6px;font-size:14px;text-align:center;background:var(--bg);color:var(--tx);font-family:inherit}
.weight-row button{background:var(--c);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:13px;font-family:inherit;cursor:pointer}

.ex-list{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.ex-card{background:var(--sf);border-radius:var(--r);padding:14px;transition:opacity .2s}
.ex-card.done{opacity:.45}
.ex-name{font-size:15px;font-weight:600;margin-bottom:2px}
.ex-card.done .ex-name{text-decoration:line-through}
.ex-desc{font-size:11px;color:var(--th);margin-bottom:8px}
.ex-sets{display:flex;gap:6px;flex-wrap:wrap}
.set-btn{width:36px;height:36px;border-radius:50%;border:2px solid var(--bd);background:var(--bg);font-size:12px;font-weight:600;color:var(--tm);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:inherit}
.set-btn.done{background:var(--c);border-color:var(--c);color:#fff}
.set-btn:active{transform:scale(.9)}

.how-btn{font-size:11px;color:var(--c);background:none;border:none;cursor:pointer;font-family:inherit;margin-top:6px;padding:0}
.how-text{font-size:11px;color:var(--tm);line-height:1.6;margin-top:6px;white-space:pre-line;display:none}

.progress-bar{height:6px;background:var(--sf);border-radius:3px;margin:12px 0 8px;overflow:hidden}
.progress-fill{height:100%;background:var(--c);border-radius:3px;transition:width .3s}
.progress-text{font-size:11px;color:var(--th);text-align:center;margin-bottom:12px}

.done-card{text-align:center;padding:32px 16px;margin:16px 0}
.done-card h2{font-size:22px;margin-bottom:8px}
.done-card p{font-size:13px;color:var(--tm);margin-bottom:20px;line-height:1.5}
.done-btns{display:flex;flex-direction:column;gap:8px}
.btn-primary{padding:14px;background:var(--c);color:#fff;border:none;border-radius:var(--r);font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;width:100%}
.btn-primary:active{opacity:.85}
.btn-ghost{padding:12px;background:none;border:1px solid var(--bd);border-radius:var(--r);font-size:14px;color:var(--tm);cursor:pointer;font-family:inherit;width:100%}

.history{margin:16px 0}
.history h3{font-size:13px;color:var(--tm);margin-bottom:8px}
.history-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px}
.history-item .hi-date{color:var(--th)}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:all .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
var ROUTINES=[
  {name:'상체',icon:'💪',desc:'가슴·어깨·삼두·등',exercises:[
    {name:'푸시업',sets:3,reps:10,how:'손 어깨너비, 머리~발끝 일직선\n가슴이 바닥 가까이 올 때까지 내려가기\n코어 힘주고 밀어 올리기'},
    {name:'다이아몬드 푸시업',sets:3,reps:8,how:'양손 엄지+검지로 다이아몬드 모양\n팔꿈치 몸에 붙이며 내려가기\n삼두에 힘주며 밀어 올리기'},
    {name:'파이크 푸시업',sets:3,reps:10,how:'엉덩이 높이 들어 역V자\n머리를 양손 사이로 내리기\n어깨 힘으로 밀어 올리기'},
    {name:'딥스 (의자)',sets:3,reps:10,how:'의자 가장자리에 손 짚기\n팔꿈치 90도까지 몸 내리기\n삼두로 밀어 올라오기'},
    {name:'슈퍼맨',sets:3,reps:12,how:'엎드려 팔다리 쭉 뻗기\n동시에 팔·가슴·다리 들어올리기\n정점 2초 유지 후 내리기'}
  ]},
  {name:'하체',icon:'🦵',desc:'스쿼트·런지·힙·종아리',exercises:[
    {name:'스쿼트',sets:4,reps:10,how:'발 어깨너비, 발끝 살짝 바깥\n엉덩이 뒤로 빼며 허벅지 평행까지\n발뒤꿈치로 밀며 올라오기'},
    {name:'런지',sets:3,reps:10,how:'한 발 앞으로 크게 내딛기\n뒷무릎 바닥 가까이 내려가기\n앞발 뒤꿈치로 밀며 원위치'},
    {name:'힙브릿지',sets:3,reps:15,how:'누워서 무릎 굽히고 발바닥 바닥에\n둔근 힘주며 골반 들어올리기\n어깨~무릎 일직선, 2초 유지'},
    {name:'불가리안 스플릿',sets:3,reps:10,how:'뒤쪽 발등을 의자 위에 올리기\n앞다리 무릎 90도까지 내려가기\n앞발 뒤꿈치로 밀며 올라오기'},
    {name:'카프레이즈',sets:3,reps:15,how:'발 앞꿈치로 서기\n최대한 높이 까치발 올리기\n정점 1초 유지 후 내리기'}
  ]},
  {name:'코어',icon:'🔥',desc:'복근·허리·골반 안정성',exercises:[
    {name:'플랭크',sets:3,reps:'30초',how:'팔꿈치 바닥, 어깨 바로 아래\n머리~발끝 일직선 유지\n배꼽 척추 쪽으로 당기듯 힘주기'},
    {name:'바이시클 크런치',sets:3,reps:15,how:'누워서 양손 귀 옆에\n한쪽 무릎 당기며 반대쪽 팔꿈치 터치\n자전거 돌리듯 교차 반복'},
    {name:'마운틴 클라이머',sets:3,reps:20,how:'푸시업 자세에서 시작\n한쪽 무릎 가슴 쪽으로 빠르게 당기기\n다리 교대하며 달리듯 반복'},
    {name:'사이드 플랭크',sets:3,reps:'20초',how:'옆으로 누워 팔꿈치 짚기\n골반 들어 머리~발 일직선\n양쪽 번갈아'},
    {name:'레그레이즈',sets:3,reps:12,how:'누워서 다리 쭉 펴기\n다리를 90도까지 올리기\n천천히 내리기 (바닥 닿기 전 멈춤)'}
  ]}
];

var S=JSON.parse(localStorage.getItem('wk2')||'{}');
if(!S.idx)S.idx=0;
if(!S.sets)S.sets={};
if(!S.weights)S.weights=[];
if(!S.history)S.history=[];
function save(){localStorage.setItem('wk2',JSON.stringify(S))}

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}

function render(){
  var r=ROUTINES[S.idx%3];
  var totalSets=0,doneSets=0;
  r.exercises.forEach(function(ex,i){
    for(var s=0;s<ex.sets;s++){
      totalSets++;
      if(S.sets[i+'_'+s])doneSets++;
    }
  });
  var pct=totalSets?Math.round(doneSets/totalSets*100):0;
  var allDone=doneSets===totalSets;

  var latestW=S.weights.length?S.weights[S.weights.length-1]:null;

  var h='<div class="header">';
  h+='<h1>'+['상체 → 하체 → 코어'][0]+'</h1>';
  h+='<div class="routine-label">'+r.icon+' '+r.name+' DAY</div>';
  h+='<div class="routine-sub">'+r.desc+'</div>';
  h+='</div>';

  h+='<div class="weight-row">';
  h+='<div class="wv">'+(latestW?latestW.kg+'<span> kg</span>':'<span style="font-size:14px">몸무게 입력</span>')+'</div>';
  h+='<input type="number" id="wi" placeholder="kg" step="0.1">';
  h+='<button onclick="saveW()">저장</button>';
  h+='</div>';

  h+='<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div>';
  h+='<div class="progress-text">'+doneSets+' / '+totalSets+' 세트 완료 ('+pct+'%)</div>';

  if(!allDone){
    h+='<div class="ex-list">';
    r.exercises.forEach(function(ex,i){
      var exDone=true;
      for(var s=0;s<ex.sets;s++){if(!S.sets[i+'_'+s]){exDone=false;break;}}
      h+='<div class="ex-card'+(exDone?' done':'')+'">';
      h+='<div class="ex-name">'+ex.name+'</div>';
      h+='<div class="ex-desc">'+ex.sets+'세트 × '+ex.reps+(typeof ex.reps==='number'?'회':'')+'</div>';
      h+='<div class="ex-sets">';
      for(var s=0;s<ex.sets;s++){
        var done=S.sets[i+'_'+s];
        h+='<button class="set-btn'+(done?' done':'')+'" onclick="togSet('+i+','+s+')">'+(done?'✓':(s+1))+'</button>';
      }
      h+='</div>';
      if(ex.how){
        h+='<button class="how-btn" onclick="togHow(this)">방법 보기</button>';
        h+='<div class="how-text">'+ex.how+'</div>';
      }
      h+='</div>';
    });
    h+='</div>';
  } else {
    h+='<div class="done-card">';
    h+='<h2>'+r.icon+' '+r.name+' 완료!</h2>';
    h+='<p>고생했어요! 다음은 <strong>'+ROUTINES[(S.idx+1)%3].icon+' '+ROUTINES[(S.idx+1)%3].name+'</strong>예요.</p>';
    h+='<div class="done-btns">';
    h+='<button class="btn-primary" onclick="nextRoutine(true)">바로 다음 루틴 하기</button>';
    h+='<button class="btn-ghost" onclick="nextRoutine(false)">다음에 할게요</button>';
    h+='</div>';
    h+='</div>';
  }

  if(S.history.length){
    h+='<div class="history"><h3>최근 기록</h3>';
    var recent=S.history.slice(-10).reverse();
    recent.forEach(function(item){
      h+='<div class="history-item"><span>'+item.icon+' '+item.name+'</span><span class="hi-date">'+item.date+'</span></div>';
    });
    h+='</div>';
  }

  document.getElementById('app').innerHTML=h;
}

function togSet(ei,si){
  var key=ei+'_'+si;
  S.sets[key]=!S.sets[key];
  save();render();
}

function togHow(btn){
  var txt=btn.nextElementSibling;
  if(txt.style.display==='block'){txt.style.display='none';btn.textContent='방법 보기';}
  else{txt.style.display='block';btn.textContent='접기';}
}

function nextRoutine(doNow){
  var r=ROUTINES[S.idx%3];
  var now=new Date();
  S.history.push({name:r.name,icon:r.icon,date:(now.getMonth()+1)+'/'+now.getDate()});
  S.idx++;
  S.sets={};
  save();
  if(doNow){
    toast(ROUTINES[S.idx%3].icon+' '+ROUTINES[S.idx%3].name+' 시작!');
  } else {
    toast('다음에 '+ROUTINES[S.idx%3].icon+' '+ROUTINES[S.idx%3].name+' 할게요!');
  }
  render();
}

function saveW(){
  var v=parseFloat(document.getElementById('wi').value);
  if(!v||v<20||v>300)return;
  var now=new Date();
  S.weights.push({kg:v,date:(now.getMonth()+1)+'/'+now.getDate()});
  save();render();
  toast(v+'kg 저장!');
}

render();
</script>
</body>
</html>
