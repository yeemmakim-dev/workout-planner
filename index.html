<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1D9E75">
<title>운동</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--c:#1D9E75;--cl:#E1F5EE;--cd:#0F6E56;--bg:#fff;--sf:#f5f5f3;--tx:#1a1a1a;--tm:#6b6b6b;--th:#9e9e9e;--bd:rgba(0,0,0,.1);--r:12px}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--sf:#1e1e1e;--tx:#f0f0f0;--tm:#a0a0a0;--th:#666;--bd:rgba(255,255,255,.1);--cl:#0a2e20}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--tx)}
#app{max-width:480px;margin:0 auto;min-height:100dvh;padding:env(safe-area-inset-top) 16px calc(16px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch}

.header{padding:20px 0 8px;text-align:center}
.header h1{font-size:13px;color:var(--th);font-weight:400;letter-spacing:.5px}
.routine-label{font-size:26px;font-weight:700;margin:6px 0 2px}
.routine-sub{font-size:12px;color:var(--th)}

.weight-row{display:flex;align-items:center;gap:8px;background:var(--sf);border-radius:var(--r);padding:10px 12px;margin:12px 0}
.weight-row .wv{font-size:20px;font-weight:700;flex:1}
.weight-row .wv span{font-size:12px;color:var(--tm);font-weight:400}
.weight-row input{width:64px;border:1px solid var(--bd);border-radius:8px;padding:6px;font-size:14px;text-align:center;background:var(--bg);color:var(--tx);font-family:inherit}
.weight-row button{background:var(--c);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:13px;font-family:inherit;cursor:pointer}

.ex-list{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.ex-card{background:var(--sf);border-radius:var(--r);padding:14px;transition:opacity .2s}
.ex-card.done{opacity:.4}
.ex-name{font-size:15px;font-weight:600;margin-bottom:2px}
.ex-card.done .ex-name{text-decoration:line-through}
.ex-desc{font-size:11px;color:var(--th);margin-bottom:8px}
.ex-sets{display:flex;gap:6px;flex-wrap:wrap}
.set-btn{width:36px;height:36px;border-radius:50%;border:2px solid var(--bd);background:var(--bg);font-size:12px;font-weight:600;color:var(--tm);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:inherit}
.set-btn.done{background:var(--c);border-color:var(--c);color:#fff}
.set-btn:active{transform:scale(.9)}

.how-btn{font-size:11px;color:var(--c);background:none;border:none;cursor:pointer;font-family:inherit;margin-top:6px;padding:0}
.how-text{font-size:11px;color:var(--tm);line-height:1.6;margin-top:6px;white-space:pre-line;display:none}

.progress-bar{height:6px;background:var(--sf);border-radius:3px;margin:12px 0 8px;overflow:hidden}
.progress-fill{height:100%;background:var(--c);border-radius:3px;transition:width .3s}
.progress-text{font-size:11px;color:var(--th);text-align:center;margin-bottom:12px}

.walk-card{text-align:center;padding:40px 16px;margin:16px 0;background:var(--cl);border-radius:var(--r)}
.walk-card h2{font-size:20px;margin-bottom:6px}
.walk-card p{font-size:13px;color:var(--tm);line-height:1.5;margin-bottom:16px}

.done-card{text-align:center;padding:32px 16px;margin:16px 0}
.done-card h2{font-size:22px;margin-bottom:8px}
.done-card p{font-size:13px;color:var(--tm);margin-bottom:20px;line-height:1.5}
.done-btns{display:flex;flex-direction:column;gap:8px}
.btn-primary{padding:14px;background:var(--c);color:#fff;border:none;border-radius:var(--r);font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;width:100%}
.btn-primary:active{opacity:.85}
.btn-ghost{padding:12px;background:none;border:1px solid var(--bd);border-radius:var(--r);font-size:14px;color:var(--tm);cursor:pointer;font-family:inherit;width:100%}

.history{margin:16px 0}
.history h3{font-size:13px;color:var(--tm);margin-bottom:8px}
.history-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px}
.history-item .hi-date{color:var(--th)}

.week-guide{margin:8px 0;padding:12px;background:var(--sf);border-radius:var(--r);font-size:11px;color:var(--tm);line-height:1.6}
.week-guide strong{color:var(--tx);font-weight:600}

.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:all .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
// 근력 A/B/C + 걷기 순환
// 큰 복합동작 먼저 → 보조 → 코어 마무리
var ROUTINES=[
  {type:'strength',name:'전신 근력 A',icon:'🏋️',desc:'스쿼트·힙힌지·로우·프레스 → 코어',exercises:[
    {name:'스쿼트',sets:3,reps:10,how:'발 어깨너비, 발끝 살짝 바깥\n엉덩이 뒤로 빼며 허벅지 평행까지\n무릎이 발끝 방향 따라가게\n발뒤꿈치로 밀며 올라오기'},
    {name:'루마니안 데드리프트',sets:3,reps:10,how:'발 골반너비, 무릎 살짝 굽힘 유지\n엉덩이를 뒤로 밀며 상체 숙이기\n햄스트링 당김 느끼면 멈추기\n둔근 쥐어짜며 올라오기'},
    {name:'덤벨 로우 (또는 밴드 로우)',sets:3,reps:10,how:'한 손+한 무릎 벤치에 짚기\n반대 손으로 덤벨/밴드 당기기\n팔꿈치를 골반 쪽으로 당기듯\n천천히 내리기'},
    {name:'인클라인 푸시업',sets:3,reps:10,how:'의자나 벽에 손 짚고 푸시업\n몸 일직선 유지\n가슴이 손 높이 가까이 올 때까지\n밀어 올리기'},
    {name:'글루트브릿지',sets:3,reps:12,how:'누워서 무릎 굽히고 발바닥 바닥에\n둔근 힘주며 골반 들어올리기\n어깨~무릎 일직선, 2초 유지\n천천히 내리기'},
    {name:'데드버그',sets:2,reps:10,how:'누워서 양팔 천장, 무릎 90도\n오른팔+왼다리 동시에 뻗기\n허리가 바닥에서 뜨지 않게\n교대 반복'}
  ]},
  {type:'walk',name:'걷기',icon:'🚶‍♀️',desc:'30~40분 빠르게 걷기 · 심폐+회복',dur:'30-40분'},
  {type:'strength',name:'전신 근력 B',icon:'💪',desc:'런지·힙쓰러스트·로우·프레스 → 코어',exercises:[
    {name:'런지',sets:3,reps:10,how:'한 발 앞으로 크게 내딛기\n뒷무릎 바닥 가까이 내려가기\n상체 곧게, 앞무릎 90도\n앞발 뒤꿈치로 밀며 원위치'},
    {name:'힙쓰러스트',sets:3,reps:12,how:'등 상부를 의자/소파에 기대기\n발바닥 바닥, 무릎 90도\n둔근 힘주며 골반 들어올리기\n정점 2초 유지'},
    {name:'밴드 로우 (또는 랫풀다운)',sets:3,reps:10,how:'밴드를 문에 걸거나 높은 곳에 고정\n양손으로 당기기\n견갑골 모으듯 등 수축\n천천히 돌아가기'},
    {name:'숄더프레스',sets:3,reps:10,how:'양손 덤벨/밴드 어깨 높이\n머리 위로 밀어올리기\n팔꿈치 완전히 펴기\n천천히 내리기'},
    {name:'스텝업',sets:2,reps:10,how:'의자나 계단에 한 발 올리기\n올린 발로 밀어 올라서기\n천천히 내려오기\n양쪽 번갈아'},
    {name:'플랭크',sets:2,reps:'30초',how:'팔꿈치 바닥, 어깨 바로 아래\n머리~발끝 일직선 유지\n배꼽 척추 쪽으로 당기듯\n엉덩이 올라가거나 처지지 않게'}
  ]},
  {type:'walk',name:'걷기',icon:'🚶‍♀️',desc:'20~30분 걷기 또는 실내자전거',dur:'20-30분'},
  {type:'strength',name:'전신 근력 C',icon:'🔥',desc:'고블릿스쿼트·풀·데드리프트 → 코어',exercises:[
    {name:'고블릿 스쿼트',sets:3,reps:10,how:'덤벨/물병 가슴 앞에 잡기\n스쿼트 자세로 앉기\n팔꿈치가 무릎 안쪽에 닿을 정도\n발뒤꿈치로 밀며 올라오기'},
    {name:'밴드 풀어파트',sets:3,reps:12,how:'밴드를 양손으로 어깨너비 잡기\n팔 펴고 가슴 높이에서 시작\n양쪽으로 당겨 벌리기\n견갑골 모으며 2초 유지'},
    {name:'덤벨 데드리프트',sets:3,reps:10,how:'양손 덤벨, 발 골반너비\n엉덩이 뒤로 밀며 숙이기\n덤벨이 정강이 따라 내려가게\n둔근·햄스트링으로 올라오기'},
    {name:'푸시업 (무릎 또는 풀)',sets:3,reps:10,how:'손 어깨너비, 몸 일직선\n가슴이 바닥 가까이 올 때까지\n코어 힘주고 밀어 올리기\n어려우면 무릎 대고'},
    {name:'사이드 런지',sets:2,reps:10,how:'양발 모으고 서기\n한쪽으로 크게 벌리며 앉기\n반대쪽 다리 곧게 유지\n밀며 원위치, 양쪽 번갈아'},
    {name:'팔로프 프레스',sets:2,reps:10,how:'밴드를 옆에 고정, 양손으로 잡기\n가슴 앞에서 팔 쭉 뻗기\n몸이 돌아가지 않게 코어 버티기\n천천히 당겨오기. 양쪽 반복'}
  ]}
];

// 순환: A근력 → 걷기 → B근력 → 걷기 → C근력 → (반복)
var CYCLE_ORDER=[0,1,2,3,4]; // indices into ROUTINES

var S=JSON.parse(localStorage.getItem('wk2')||'{}');
if(S.idx===undefined)S.idx=0;
if(!S.sets)S.sets={};
if(!S.weights)S.weights=[];
if(!S.history)S.history=[];
function save(){localStorage.setItem('wk2',JSON.stringify(S))}

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}

function curRoutine(){return ROUTINES[CYCLE_ORDER[S.idx%CYCLE_ORDER.length]]}

function render(){
  var r=curRoutine();
  var h='';

  // Header
  h+='<div class="header">';
  h+='<h1>PCOS 맞춤 루틴</h1>';
  h+='<div class="routine-label">'+r.icon+' '+r.name+'</div>';
  h+='<div class="routine-sub">'+r.desc+'</div>';
  h+='</div>';

  // Weight
  var latestW=S.weights.length?S.weights[S.weights.length-1]:null;
  h+='<div class="weight-row">';
  h+='<div class="wv">'+(latestW?latestW.kg+'<span> kg</span>':'<span style="font-size:14px">몸무게 입력</span>')+'</div>';
  h+='<input type="number" id="wi" placeholder="kg" step="0.1">';
  h+='<button onclick="saveW()">저장</button>';
  h+='</div>';

  if(r.type==='walk'){
    // 걷기 날
    h+='<div class="walk-card">';
    h+='<h2>'+r.icon+' 걷기 '+r.dur+'</h2>';
    h+='<p>빠르게 걷기, 경사 걷기, 실내자전거 등<br>심폐 회복 + 활동량 확보</p>';
    h+='<button class="btn-primary" onclick="completeWalk()">걷기 완료!</button>';
    h+='</div>';
  } else {
    // 근력 날
    var totalSets=0,doneSets=0;
    r.exercises.forEach(function(ex,i){
      for(var s=0;s<ex.sets;s++){
        totalSets++;
        if(S.sets[i+'_'+s])doneSets++;
      }
    });
    var pct=totalSets?Math.round(doneSets/totalSets*100):0;
    var allDone=doneSets===totalSets;

    h+='<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div>';
    h+='<div class="progress-text">'+doneSets+' / '+totalSets+' 세트 ('+pct+'%)</div>';

    if(!allDone){
      h+='<div class="ex-list">';
      r.exercises.forEach(function(ex,i){
        var exDone=true;
        for(var s=0;s<ex.sets;s++){if(!S.sets[i+'_'+s]){exDone=false;break;}}
        h+='<div class="ex-card'+(exDone?' done':'')+'">';
        h+='<div class="ex-name">'+ex.name+'</div>';
        h+='<div class="ex-desc">'+ex.sets+'세트 × '+ex.reps+(typeof ex.reps==='number'?'회':'')+(ex.sets<=2?' · 마무리':' · 세트 간 60-90초 휴식')+'</div>';
        h+='<div class="ex-sets">';
        for(var s=0;s<ex.sets;s++){
          var done=S.sets[i+'_'+s];
          h+='<button class="set-btn'+(done?' done':'')+'" onclick="togSet('+i+','+s+')">'+(done?'✓':(s+1))+'</button>';
        }
        h+='</div>';
        if(ex.how){
          h+='<button class="how-btn" onclick="togHow(this)">방법 보기</button>';
          h+='<div class="how-text">'+ex.how+'</div>';
        }
        h+='</div>';
      });
      h+='</div>';
    } else {
      var next=ROUTINES[CYCLE_ORDER[(S.idx+1)%CYCLE_ORDER.length]];
      h+='<div class="done-card">';
      h+='<h2>'+r.icon+' 완료!</h2>';
      h+='<p>고생했어요!<br>다음: <strong>'+next.icon+' '+next.name+'</strong></p>';
      h+='<div class="done-btns">';
      h+='<button class="btn-primary" onclick="nextRoutine(true)">바로 다음 하기</button>';
      h+='<button class="btn-ghost" onclick="nextRoutine(false)">다음에 할게요</button>';
      h+='</div>';
      h+='</div>';
    }
  }

  // 주간 가이드
  h+='<div class="week-guide">';
  h+='<strong>주간 가이드</strong><br>';
  h+='근력 3일 + 걷기 2일 + 휴식 2일<br>';
  h+='순서: 근력A → 걷기 → 근력B → 걷기 → 근력C → 휴식<br>';
  h+='주 150분 이상 유산소 목표 · 앉아있는 시간 줄이기';
  h+='</div>';

  // History
  if(S.history.length){
    h+='<div class="history"><h3>최근 기록</h3>';
    var recent=S.history.slice(-10).reverse();
    recent.forEach(function(item){
      h+='<div class="history-item"><span>'+item.icon+' '+item.name+'</span><span class="hi-date">'+item.date+'</span></div>';
    });
    h+='</div>';
  }

  document.getElementById('app').innerHTML=h;
}

function togSet(ei,si){
  var key=ei+'_'+si;
  S.sets[key]=!S.sets[key];
  save();render();
}

function togHow(btn){
  var txt=btn.nextElementSibling;
  if(txt.style.display==='block'){txt.style.display='none';btn.textContent='방법 보기';}
  else{txt.style.display='block';btn.textContent='접기';}
}

function completeWalk(){
  var r=curRoutine();
  var now=new Date();
  S.history.push({name:r.name,icon:r.icon,date:(now.getMonth()+1)+'/'+now.getDate()});
  S.idx++;
  save();
  toast('걷기 완료! 다음은 '+curRoutine().icon+' '+curRoutine().name);
  render();
}

function nextRoutine(doNow){
  var r=curRoutine();
  var now=new Date();
  S.history.push({name:r.name,icon:r.icon,date:(now.getMonth()+1)+'/'+now.getDate()});
  S.idx++;
  S.sets={};
  save();
  if(doNow){
    toast(curRoutine().icon+' '+curRoutine().name+' 시작!');
  } else {
    toast('다음에 '+curRoutine().icon+' '+curRoutine().name+' 할게요!');
  }
  render();
}

function saveW(){
  var v=parseFloat(document.getElementById('wi').value);
  if(!v||v<20||v>300)return;
  var now=new Date();
  S.weights.push({kg:v,date:(now.getMonth()+1)+'/'+now.getDate()});
  save();render();
  toast(v+'kg 저장!');
}

render();
</script>
</body>
</html>
